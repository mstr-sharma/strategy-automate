name: live-smoke

# Read-only smoke test against a real tenant (tests/live/smoke.py). Manual only.
#
# One-time setup (repository Settings → Environments → New environment "strategy-live"):
#   - Required reviewers: yourself, so every run waits for an explicit approval.
#   - Deployment branches: main only.
#   - Environment secrets: MSTR_BASE (https://<tenant>.strategy.com/MicroStrategyLibrary) and
#     MSTR_API_TOKEN — an API token of a READ-ONLY service account, never a personal one.
#   - Environment variable (optional): MSTR_PROJECT_NAME, a project the account can read.
# The run prints step names, statuses and timings only: no host names, object names or tokens.
on:
  workflow_dispatch:
    inputs:
      project:
        description: Project name or id to search in (default = the MSTR_PROJECT_NAME variable)
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: live-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: strategy-live
    env:
      MSTR_BASE: ${{ secrets.MSTR_BASE }}
      MSTR_API_TOKEN: ${{ secrets.MSTR_API_TOKEN }}
      MSTR_AUTH_METHOD: api-token
      MSTR_PROJECT_NAME: ${{ inputs.project || vars.MSTR_PROJECT_NAME }}
      MSTR_SECRET_STORE: none     # nothing is cached on the runner
      MSTR_SESSION_CACHE: "0"
      UV_VERSION: "0.11.8"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - name: Install the locked dependencies (hash-checked)
        run: |
          python -m pip install --disable-pip-version-check "uv==${UV_VERSION}"
          python -m uv export --frozen --no-dev --no-emit-project --format requirements-txt \
            -o "$RUNNER_TEMP/requirements.txt"
          python -m pip install --disable-pip-version-check --require-hashes -r "$RUNNER_TEMP/requirements.txt"
      - name: Smoke test (read-only)
        run: python tests/live/smoke.py
