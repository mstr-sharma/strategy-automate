name: security

# Dependency advisories arrive without any change to this repo, so the audit also runs weekly.
on:
  schedule:
    - cron: "41 5 * * 1"
  push:
    branches: [main]
    paths: [uv.lock, pyproject.toml, tests/tools/osv_audit.py, .github/workflows/security.yml]
  pull_request:
    paths: [uv.lock, pyproject.toml, tests/tools/osv_audit.py, .github/workflows/security.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: OSV audit of uv.lock
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      # Stdlib only: fails on any advisory not reviewed in tests/tools/osv_audit.py ACCEPTED.
      - name: Audit every locked package (both Python forks)
        run: python tests/tools/osv_audit.py
