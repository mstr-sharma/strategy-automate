name: security

# Dependency advisories arrive without any change to this repo, so the audit also runs weekly.
on:
  schedule:
    - cron: "41 5 * * 1"
  push:
    branches: [main]
    paths: [uv.lock, pyproject.toml, tests/tools/osv_audit.py, .github/workflows/security.yml]
  pull_request:
    paths: [uv.lock, pyproject.toml, tests/tools/osv_audit.py, .github/workflows/security.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: OSV audit of uv.lock
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      # Stdlib only: fails on any advisory not reviewed in tests/tools/osv_audit.py ACCEPTED.
      - name: Audit every locked package (both Python forks)
        run: python tests/tools/osv_audit.py
