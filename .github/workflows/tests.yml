name: tests

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: the jobs only check out and run tests.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 = oldest supported (pyproject requires-python); 3.13 = newest.
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      # Actions pinned to commit SHAs (tag in the comment) so a moved tag can't change CI.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install "requests>=2.31,<3"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Ruff
        run: python -m pip install "ruff==0.16.10" && ruff check .
